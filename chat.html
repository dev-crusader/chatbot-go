<!DOCTYPE html>
<html>
  <head>
    <title>Customer Service Chat</title>
    <link rel="stylesheet" href="./static/style.css" />
  </head>
  <body>
    <div class="header">
      <h1>Welcome to Our Customer Service</h1>
      <p>How can we help you today?</p>
    </div>

    <div class="suggestions">
      <button
        class="suggestion-btn"
        onclick="usePrompt('Can you tell me your business hours?')"
      >
        Business Hours
      </button>
      <button
        class="suggestion-btn"
        onclick="usePrompt('What services do you offer?')"
      >
        Our Services
      </button>
      <button
        class="suggestion-btn"
        onclick="usePrompt('What is your contact email?')"
      >
        Contact Us
      </button>
    </div>

    <div id="chat-container">
      <div id="messages"></div>
      <div class="input-container">
        <div class="input-wrapper">
          <input
            type="text"
            id="message-input"
            placeholder="Type your message..."
          />
        </div>
        <button onclick="sendMessage()">Send</button>
        <button id="new-btn" onclick="startNewChat()">New Chat</button>
      </div>
    </div>

    <script>
      const messageContainer = document.getElementById("messages");
      const messageInput = document.getElementById("message-input");

      let chatID = null;
      let userID = null;

      document.addEventListener("DOMContentLoaded", startNewChat);

      function startNewChat() {
        fetch("/create", {
          method: "POST",
        })
          .then((response) => response.json())
          .then((data) => {
            chatID = data.chat_id;
            userID = data.user_id;
            messageContainer.innerHTML = "";
          })
          .catch(() => {
            alert("Error creating chat");
          });
      }

      function appendMessage(role, content) {
        const messageDiv = document.createElement("div");

        messageDiv.className = `message ${role}`;
        messageDiv.textContent = content;

        messageContainer.appendChild(messageDiv);
        messageContainer.scrollTop = messageContainer.scrollHeight;
      }

      function sendMessage() {
        const message = messageInput.value.trim();

        if (!message) return;

        appendMessage("user", message);

        messageInput.value = "";

        fetch("/send", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            user_id: userID,
            chat_id: chatID,
            user_message: message,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            appendMessage("assistant", data.message);
          })
          .catch(() => {
            alert("Error sending message");
          });
      }

      function usePrompt(prompt) {
        messageInput.value = prompt;
        sendMessage();
      }

      messageInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
